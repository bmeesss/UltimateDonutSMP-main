name: Arena Verify Build

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Compile
        run: mvn -B -q -DskipTests compile > /tmp/compile.log 2>&1 || true; tail -5 /tmp/compile.log

      - name: Test
        run: mvn -B clean test > /tmp/test.log 2>&1 || true; grep -E "Tests run|BUILD" /tmp/test.log | tail -4

      - name: Package
        run: mvn -B clean package "-Dmaven.test.skip=true" > /tmp/package.log 2>&1 || true; grep -E "BUILD|ERROR" /tmp/package.log | head -5

      - name: Jar audit
        run: |
          JAR=$(ls target/*.jar 2>/dev/null | head -1) || true
          {
            if [ -z "$JAR" ]; then echo "NO JAR PRODUCED"; exit 0; fi
            echo "JAR: $JAR"
            unzip -l "$JAR" | tail -1
            echo "== modern-API reference scan in plugin classes =="
            mkdir -p /tmp/jarscan && cd /tmp/jarscan && unzip -qo "$GITHUB_WORKSPACE/$JAR" 'com/bx/*'
            grep -rl "org/bukkit/block/data\|Damageable\|PersistentDataContainer\|WrappedNumberFormat" com 2>/dev/null | head -20 || echo "no obvious modern refs in com/bx"
          } > /tmp/audit.log 2>&1 || true
          tail -40 /tmp/audit.log 2>/dev/null || true

      - name: Collect result
        id: result
        run: |
          {
            echo "### Verify run @ $(date -u +%FT%TZ) on commit $GITHUB_SHA"
            echo
            if grep -q "BUILD SUCCESS" /tmp/test.log 2>/dev/null && grep -q "BUILD SUCCESS" /tmp/package.log 2>/dev/null && ! grep -qE "ERROR|BUILD FAILURE" /tmp/compile.log 2>/dev/null; then
              echo "RESULT: PASS"
            else
              echo "RESULT: FAIL"
            fi
            echo
            echo "#### tests summary"
            grep -E "Tests run:" /tmp/test.log 2>/dev/null | tail -3
            echo
            echo "#### compile log tail"
            tail -n 60 /tmp/compile.log 2>/dev/null
            echo "#### test log errors"
            grep -E "ERROR|FAIL" /tmp/test.log 2>/dev/null | head -40
            echo "#### package log tail"
            grep -E "BUILD|ERROR" /tmp/package.log 2>/dev/null | head -10
            echo "#### jar audit"
            cat /tmp/audit.log 2>/dev/null
          } > ci-result.md

      - name: Commit result back
        if: always()
        run: |
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p ci
          mv ci-result.md ci/verify-$SHORT.md 2>/dev/null || echo "RESULT MISSING" > ci/verify-$SHORT.md
          git config user.name "arena-ci[bot]"
          git config user.email "arena-ci@users.noreply.github.com"
          git add -f ci/verify-$SHORT.md
          git commit -m "ci: verify result for $SHORT [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
        continue-on-error: true

      - name: Commit status
        run: |
          STATE=success
          grep -q "BUILD FAILURE" /tmp/*.log 2>/dev/null && STATE=failure
          curl -sf -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"arena/verify\",\"description\":\"maven compile+test+package\"}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
